name: Holly Bot for Windows

# Builds Holly Bot for Windows (desktop/) into its installer,
# Holly-Bot-Setup.exe, on Windows. On main, when desktop/package.json has a
# version that isn't released yet, it publishes that as a GitHub release,
# windows-v<version>: the installer people download (the latest one is always
# at releases/latest/download/Holly-Bot-Setup.exe, and under its names
# before, Holly-Bot-Computer-Setup.exe and Holly-Computer-Setup.exe, for links
# to those), and what the app updates itself from (electron-updater reads
# latest.yml there). Otherwise the installer is kept with the run, to try.
#
# Holly Bot Computer itself (computer/holly-computer.mjs) keeps itself current
# from the Holly Bot site, in the app as everywhere, so a new app version is
# only needed when desktop/ changes: raise its version in desktop/package.json.

on:
  push:
    branches: ['**']
    paths:
      - 'desktop/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    env:
      # electron-builder fetches the Electron it packages; the one for this
      # runner isn't needed.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The app, holly-computer.mjs as committed, and Node.js for Windows.
      - name: Stage the app
        run: node scripts/stage.mjs

      - name: Which version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=windows-v$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" = "refs/heads/main" ] && ! gh release view "windows-v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      # Signed when the repository has a code signing certificate (optional
      # secrets: WIN_CSC_LINK, the .pfx in base64, and WIN_CSC_KEY_PASSWORD).
      # Unsigned, Windows says it protected the PC the first time: More info →
      # Run anyway.
      - name: Build the installer
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Keep the installer with the run
        uses: actions/upload-artifact@v4
        with:
          name: Holly-Bot-Setup-${{ steps.version.outputs.version }}
          path: |
            desktop/dist/Holly-Bot-Setup.exe
            desktop/dist/Holly-Bot-Setup.exe.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error

      - name: Publish the release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > notes.md <<'EOF'
          **Download [Holly-Bot-Setup.exe](https://github.com/xgamer791/holly-bot/releases/latest/download/Holly-Bot-Setup.exe) and open it.** Holly Bot installs and opens, with Holly Bot Computer inside it, and no Node.js or terminal needed.

          - Sign in on the Holly Bot window it opens, with the Apple or Google account you use in Holly Bot. That links this PC to your account. Then open Holly Bot on your phone and tap Connect.
          - Holly Bot Computer starts silently when you sign in to Windows, so your bots keep working around the clock, with an icon in the taskbar's corner (its settings are there). Open Holly Bot from the Start menu or the desktop whenever you like.
          - A PC that ran `node holly-computer.mjs` carries on as the same computer, with the same bots, keys and browser logins.
          - Windows may say it protected your PC the first time: choose **More info → Run anyway**.
          - It keeps itself up to date, with no one needing to be at the PC: updates install themselves once no bot is working.
          EOF
          # Also under its names before, for links to those.
          cp dist/Holly-Bot-Setup.exe dist/Holly-Bot-Computer-Setup.exe
          cp dist/Holly-Bot-Setup.exe dist/Holly-Computer-Setup.exe
          gh release create "$TAG" \
            dist/Holly-Bot-Setup.exe dist/Holly-Bot-Setup.exe.blockmap dist/latest.yml \
            dist/Holly-Bot-Computer-Setup.exe dist/Holly-Computer-Setup.exe \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Holly Bot for Windows $VERSION" --notes-file notes.md
