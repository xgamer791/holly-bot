name: Set up Stripe and Vultr

# Run by hand (Actions → Set up Stripe and Vultr → Run workflow) once
# STRIPE_SECRET_KEY and VULTR_API_KEY are repository secrets (CONVEX.md,
# step 5). At Stripe it makes the plans' products and prices, the webhook and
# the billing portal; at Vultr it checks the key and the plans' server sizes.
# The ids, the webhook's signing secret and both keys go in the deployment's
# variables (scripts/convex-billing-setup.mjs). Run it again any time, and after
# switching Stripe to live mode: it keeps what's right and fixes what isn't.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: convex-deploy
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
      VULTR_DRY_RUN: ${{ secrets.VULTR_DRY_RUN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only Holly Bot's own production deployment, as in convex.yml.
      - name: Require Holly Bot's deploy key
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::CONVEX_DEPLOY_KEY is not set. See CONVEX.md."
            exit 1
          fi
          case "${CONVEX_DEPLOY_KEY%%|*}" in
            *impressive-ferret-800) ;;
            *)
              echo "::error::CONVEX_DEPLOY_KEY is not the production key for impressive-ferret-800, Holly Bot's own deployment. Refusing to set it up."
              exit 1
              ;;
          esac

      - name: Set up Stripe and check Vultr
        run: node --experimental-strip-types --no-warnings scripts/convex-billing-setup.mjs
